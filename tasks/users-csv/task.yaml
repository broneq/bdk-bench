id: users-csv
title: Export the admin user list to CSV
prompt: I want to export the user list to CSV
area:
  - src/admin/AdminUsersPage.tsx
  - src/api/adminUsers.ts
# Hidden: the spec's answers in short. Choices here are what the simulated user answers, not pass conditions.
summary: >-
  Add a CSV export to the admin user administration page. It downloads, in the browser and
  without any new request or endpoint, every user matching the current search, role and status
  filters in the current sort order across all pages, as an RFC 4180, UTF-8-with-BOM file with
  14 fixed columns, a spreadsheet formula-injection guard, localized header labels and a
  localized button that is admin-only and disabled when nothing matches. The admin user
  management spec and the changelog are updated.

