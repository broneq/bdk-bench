id: operator-i18n
title: Localize the operator pages (roadmap M-I18N-004)
prompt: >-
  The operator pages still show English text when another language is active. It's in the
  roadmap - please fix it.
area:
  - src/operator/OperatorPage.tsx
  - src/operator/OperatorDiagnosticsPage.tsx
  - src/operator/AuditEntryDetails.tsx
  - src/operator/auditFormat.ts
  - src/i18n/messages.ts
roadmap:
  milestone: M-I18N-004
  tasks: [T-I18N-011, T-I18N-012, T-I18N-013]
# Hidden: the spec's answers in short. Choices here are what the simulated user answers, not pass conditions.
summary: >-
  Implement ROADMAP.md milestone M-I18N-004: route every user-visible string on /operator and
  /operator/diagnostics (labels, options, headings, captions, aria-labels, summaries, state
  blocks, metadata labels, Yes/No, unavailable texts) through the localization registry with
  unchanged English defaults, using single templates with placeholders for composed strings and
  one/many keys for counts; keep audit enum identifiers in option values, URLs and requests
  while table and detail cells show localized labels; remove the three registry keys without
  call sites; leave backend seed alignment to the backend and say so; add a changelog entry.

